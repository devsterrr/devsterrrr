{% extends 'base.html' %}
{% block content %}
    <h1>Мої завдання</h1>
    
    <div class="form-container">
        <form action="{{ url_for('add_task') }}" method="POST">
            <input type="text" name="title" placeholder="Назва завдання" required>
            <textarea name="description" placeholder="Опис (необов'язково)"></textarea>
            <button type="submit">Додати завдання</button>
        </form>
    </div>

    <div class="task-grid">
        {% for task in tasks %}
        <div class="task-card">
            <h3>{{ task[1] }}</h3>
            <p>{{ task[2] }}</p>
            <small>{{ task[3] }}</small>
            <hr>
            <a href="{{ url_for('delete_task', id=task[0]) }}" class="delete-link">Видалити</a>
        </div>
        {% endfor %}
    </div>
{% endblock %}
